[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["../wt-release-v40000-prep/contracts/atomic-swap/lib"]
remappings = [
  "forge-std/=../wt-release-v40000-prep/contracts/atomic-swap/lib/forge-std/src/",
  "atomic-swap/=../wt-release-v40000-prep/contracts/atomic-swap/src/",
  "wsost/=../wt-release-v40000-prep/contracts/wsost/src/",
]
allow_paths = ["../wt-release-v40000-prep/contracts"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 256 }
# local only — no rpc endpoints
