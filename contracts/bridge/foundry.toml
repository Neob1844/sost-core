[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fuzz = { runs = 1024 }
invariant = { runs = 64, depth = 64 }

# C701 — DEVELOPMENT ONLY. No RPC endpoints on purpose: nothing here deploys to any public chain.
# Tests run in-process (forge test) or against a local Anvil. forge-std is not committed:
#   git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
