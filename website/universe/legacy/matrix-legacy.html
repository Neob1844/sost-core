<div id="sost-splash" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:99999;background:#000;display:none;transition:opacity .5s ease;zoom:1.0">

  <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);pointer-events:none;z-index:20"></div>

<script>
(function(){
  if(sessionStorage.getItem('splashShown'))return;
  var sp=document.getElementById('sost-splash');
  sp.style.display='block';

  // === SHARED AUDIO CONTEXT (reuse to avoid creating hundreds) ===
  var _ac=null;
  function getAC(){if(!_ac)try{_ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}return _ac;}

  // === MATRIX AMBIENT SOUND (drone + digital noise, full 12s) ===
  function playMatrixAmbient(duration){
    var ac=getAC();if(!ac)return;
    // Low sawtooth drone
    var drone=ac.createOscillator();var dg=ac.createGain();
    drone.type='sawtooth';drone.frequency.value=55;
    dg.gain.setValueAtTime(0,ac.currentTime);
    dg.gain.linearRampToValueAtTime(0.06,ac.currentTime+2);
    dg.gain.setValueAtTime(0.06,ac.currentTime+duration-2);
    dg.gain.linearRampToValueAtTime(0,ac.currentTime+duration);
    drone.connect(dg);dg.connect(ac.destination);
    drone.start(ac.currentTime);drone.stop(ac.currentTime+duration);
    // Digital noise through bandpass
    var bs=ac.sampleRate*2;var nb=ac.createBuffer(1,bs,ac.sampleRate);
    var ch=nb.getChannelData(0);for(var i=0;i<bs;i++)ch[i]=Math.random()*2-1;
    var ns=ac.createBufferSource();ns.buffer=nb;ns.loop=true;
    var ng=ac.createGain();var nf=ac.createBiquadFilter();
    nf.type='bandpass';nf.frequency.value=2000;nf.Q.value=3;
    ng.gain.setValueAtTime(0,ac.currentTime);
    ng.gain.linearRampToValueAtTime(0.03,ac.currentTime+3);
    ng.gain.setValueAtTime(0.03,ac.currentTime+duration-2);
    ng.gain.linearRampToValueAtTime(0,ac.currentTime+duration);
    ns.connect(nf);nf.connect(ng);ng.connect(ac.destination);
    ns.start(ac.currentTime);ns.stop(ac.currentTime+duration);
  }

  // === MATRIX TICK SOUND (30 variations, 5× louder, filtered) ===
  var MX_FREQS=[80,100,120,150,180,200,250,300,350,400,450,500,600,700,800,1000,1200,1500,1800,2000,2500,3000,120,180,250,400,600,800,1500,2500];
  var MX_TYPES=['square','sawtooth','square','sawtooth','triangle'];
  function playMatrixTick(){
    var ac=getAC();if(!ac)return;
    var vi=Math.random()*30|0;
    var o=ac.createOscillator();var g=ac.createGain();var f=ac.createBiquadFilter();
    o.type=MX_TYPES[vi%5];o.frequency.value=MX_FREQS[vi];
    f.type='bandpass';f.frequency.value=MX_FREQS[vi]*1.5;f.Q.value=5+Math.random()*10;
    g.gain.setValueAtTime(0.25,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.08);
    o.connect(f);f.connect(g);g.connect(ac.destination);
    o.start(ac.currentTime);o.stop(ac.currentTime+0.08);
  }

  // === MATRIX RAIN (RED) on canvas ===
  var canvas=document.getElementById('matrix-canvas');
  var ctx=canvas.getContext('2d');
  var W,H,columns,drops,fontSize=18;
  var chars='\u30A2\u30A4\u30A6\u30A8\u30AA\u30AB\u30AD\u30AF\u30B1\u30B3\u30B5\u30B7\u30B9\u30BB\u30BD\u30BF\u30C1\u30C4\u30C6\u30C80123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$#@&*+=<>{}[]'.split('');

  function initMatrix(){
    W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;
    if(W<600)fontSize=13;
    columns=Math.floor(W/fontSize);
    drops=[];for(var i=0;i<columns;i++)drops[i]=Math.random()*-50|0;
  }
  initMatrix();
  window.addEventListener('resize',initMatrix);

  var matrixRunning=true;
  function drawMatrix(){
    if(!matrixRunning)return;
    ctx.fillStyle='rgba(0,0,0,0.05)';
    ctx.fillRect(0,0,W,H);
    ctx.font=fontSize+'px monospace';
    for(var i=0;i<drops.length;i++){
      var ch=chars[Math.random()*chars.length|0];
      var y=drops[i]*fontSize;
      ctx.fillStyle='#ffffff';
      ctx.fillText(ch,i*fontSize,y);
      if(drops[i]>1){ctx.fillStyle='#fb010d';ctx.fillText(chars[Math.random()*chars.length|0],i*fontSize,(drops[i]-1)*fontSize);}
      if(drops[i]>3){var br=Math.random();ctx.fillStyle=br>.5?'#cc0000':'#880000';ctx.fillText(chars[Math.random()*chars.length|0],i*fontSize,(drops[i]-2-(Math.random()*2|0))*fontSize);}
      if(y>H&&Math.random()>.975)drops[i]=0;
      drops[i]++;
    }
    requestAnimationFrame(drawMatrix);
  }
  requestAnimationFrame(drawMatrix);

  // Start ambient drone immediately
  playMatrixAmbient(12);

  // === LOGO EMERGE (3s) ===
  var logo=document.getElementById('splash-logo');
  var sigmaRunning=true;
  setTimeout(function(){logo.style.opacity='0.15';},2200);
  setTimeout(function(){logo.style.opacity='0.4';logo.style.filter='drop-shadow(0 0 13px rgba(251,1,13,0.3))';},2800);
  setTimeout(function(){logo.style.opacity='0.7';logo.style.filter='drop-shadow(0 0 25px rgba(251,1,13,0.5))';},3400);
  setTimeout(function(){logo.style.opacity='1';logo.style.filter='drop-shadow(0 0 38px rgba(251,1,13,0.6)) drop-shadow(0 0 75px rgba(251,1,13,0.3))';logo.style.animation='sostLogoPulse 3.6s ease-in-out infinite';},4000);

  // === TITLE TYPING (5s) ===
  var titleEl=document.getElementById('splash-title');
  var titleText=[{t:'SOST',c:'#fb010d'}];
  var charIdx=0,segIdx=0;
  function typeTitle(){
    if(segIdx>=titleText.length)return;
    var seg=titleText[segIdx];
    if(charIdx<seg.t.length){
      var span=document.createElement('span');
      span.style.color=seg.c;
      span.style.textShadow='0 0 10px rgba(251,1,13,0.5)';
      span.textContent=seg.t[charIdx];
      titleEl.appendChild(span);titleEl.style.opacity='1';
      playMatrixTick();
      charIdx++;setTimeout(typeTitle,120);
    }else{charIdx=0;segIdx++;setTimeout(typeTitle,60);}
  }
  setTimeout(typeTitle,5000);

  // === TERMINAL LINES (7.5s) ===
  var lines=['> Initializing node connection...','> Verifying genesis block...','> Syncing chain data...','> System ready.'];
  var box=document.getElementById('spl-lines');
  lines.forEach(function(t){
    var d=document.createElement('div');d.className='spl-line';
    d.innerHTML='<span style="color:#aa0000">&gt;</span><span style="color:#cc0000">'+t.slice(1)+'</span>';
    box.appendChild(d);
  });
  var els=box.querySelectorAll('.spl-line');
  els.forEach(function(el,i){
    var t0=6500+i*500;
    setTimeout(function(){el.classList.add('go');},t0);
    for(var k=0;k<12;k++){setTimeout(playMatrixTick,t0+k*200);}
  });

  // === AUDIO: unlock context + play epic melody on user interaction ===
  function _splashSound(){
    try{getAC();}catch(e){}
    if(typeof playRandomMelody==='function') playRandomMelody();
  }
  sp.addEventListener('click',_splashSound,{once:true});
  sp.addEventListener('touchstart',_splashSound,{once:true});

  // === TRANSITION (11s fade, 12s remove) ===
  setTimeout(function(){
    matrixRunning=false;
    sigmaRunning=false;
    sp.style.opacity='0';
    setTimeout(function(){sp.style.display='none';ctx=null;},600);
    sessionStorage.setItem('splashShown','1');
  },12000);
})();
</script>
