name: V14 Fork Safety

# Phase A / A5 of docs/V14_EXECUTION_PLAN.md — runs the V14 consensus safety
# pins on every push/PR so a fork-gating constant cannot drift, and the H3/H4
# block-validation semantics cannot regress, without CI going red.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  v14-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev libsecp256k1-dev

      - name: Configure
        # libsecp256k1-dev is REQUIRED even for the safety tests: the sost-core
        # library always compiles src/tx_signer.cpp, which includes <secp256k1.h>
        # and uses the (always-present) ECDSA APIs, and links -lsecp256k1.
        # SBPOW stays OFF: the safety tests don't need the Schnorr path, and the
        # stock Ubuntu package has no schnorrsig module (SBPOW=ON would
        # FATAL_ERROR at configure). Base ECDSA is all tx_signer needs.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSOST_ENABLE_PHASE2_SBPOW=OFF

      - name: Build V14 safety tests
        run: |
          cmake --build build --target test-v14-fork-gates -j2
          cmake --build build --target test-v14-h3-h4 -j2
          cmake --build build --target test-gv-slice1-activation -j2
          cmake --build build --target test-v13-gold-vault-slice1 -j2
          cmake --build build --target test-gv-g4 -j2
          cmake --build build --target test-gv-slice1-block -j2
          cmake --build build --target test-gv-g4-coinbase -j2
          cmake --build build --target test-gv-g5 -j2
          cmake --build build --target test-gv-governance-determinism -j2
          cmake --build build --target test-popc-v15 -j2
          cmake --build build --target test-popc-v15-set -j2
          cmake --build build --target test-popc-v15-carrier -j2
          cmake --build build --target test-popc-v15-eligibility -j2
          cmake --build build --target test-popc-v15-lifecycle -j2
          cmake --build build --target test-popc-v15-authz -j2
          cmake --build build --target test-popc-v15-soak -j2
          cmake --build build --target test-atomic-swap-btc-script -j2
          cmake --build build --target test-atomic-swap-btc-test-vectors -j2
          cmake --build build --target test-atomic-swap-btc-signing -j2
          cmake --build build --target test-atomic-swap-coordinator -j2
          cmake --build build --target test-atomic-swap-e2e-sim -j2

      - name: Run V14 fork-gate pins (constants must not drift)
        run: ./build/test-v14-fork-gates

      - name: Run V14 H3/H4 block-validation semantics
        run: ./build/test-v14-h3-h4

      - name: Run Gold Vault Slice 1 config + regression + G4 tally
        run: |
          ./build/test-gv-slice1-activation
          ./build/test-v13-gold-vault-slice1
          ./build/test-gv-g4
          ./build/test-gv-slice1-block
          ./build/test-gv-g4-coinbase
          ./build/test-gv-g5
          ./build/test-gv-governance-determinism
          ./build/test-popc-v15
          ./build/test-popc-v15-set
          ./build/test-popc-v15-carrier
          ./build/test-popc-v15-eligibility
          ./build/test-popc-v15-lifecycle
          ./build/test-popc-v15-authz
          ./build/test-popc-v15-soak
          ./build/test-atomic-swap-btc-script
          ./build/test-atomic-swap-btc-test-vectors
          ./build/test-atomic-swap-btc-signing
          ./build/test-atomic-swap-coordinator
          ./build/test-atomic-swap-e2e-sim

  # Full suite, HARD GATE (AEGIS H1, 27-Nov-2026). Built in the MAINNET configuration: SbPoW ON (default) with the
  # libsecp256k1 (schnorrsig) from the distribution package. The old job built SOST_ENABLE_PHASE2_SBPOW=OFF,
  # a binary that is NOT consensus-capable (Schnorr verification stubbed to false), and was allowed to fail, which hid
  # 3 failures (2 of them artefacts of that stub) and never ran the Schnorr / SbPoW tests at all.
  full-ctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev libsecp256k1-dev m4
      - name: Configure + build (mainnet configuration)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
      - name: Binary is consensus-capable (SbPoW path compiled in)
        run: test "$(strings build/sost-node | grep -c 'POW-SIG/v11')" -gt 0
      - name: ctest
        run: ctest --test-dir build --output-on-failure
