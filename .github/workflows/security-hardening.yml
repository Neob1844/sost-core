# SOST security CI — V4 hardening.
# Sanitizer builds + fuzz smoke + a REQUIRED full-test gate (no continue-on-error).
# SBPOW=ON needs libsecp256k1 with the schnorrsig module, which the stock Ubuntu
# package lacks, so every SBPOW job builds libsecp256k1 from source first.
name: security-hardening

on:
  push:
    branches: [ feat/fork-store-hardening ]
  pull_request:
  workflow_dispatch:

env:
  SECP_REF: v0.4.1

jobs:
  unit-and-consensus:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: base deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev autoconf automake libtool pkg-config git
      - name: build libsecp256k1 with schnorrsig
        run: |
          git clone --depth 1 --branch "$SECP_REF" https://github.com/bitcoin-core/secp256k1.git /tmp/secp
          cd /tmp/secp && ./autogen.sh
          ./configure --enable-module-schnorrsig --enable-module-recovery --disable-benchmark --disable-tests --disable-exhaustive-tests
          make -j"$(nproc)" && sudo make install && sudo ldconfig
      - name: build
        run: cmake -S . -B build -DSOST_ENABLE_PHASE2_SBPOW=ON -DSOST_TESTNET_FORKS=OFF -DCMAKE_BUILD_TYPE=Release && cmake --build build -j"$(nproc)"
      - name: ctest (REQUIRED — no continue-on-error)
        run: ctest --test-dir build --output-on-failure   # a single failure fails the job

  asan-ubsan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: base deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev autoconf automake libtool pkg-config git
      - name: build libsecp256k1 with schnorrsig
        run: |
          git clone --depth 1 --branch "$SECP_REF" https://github.com/bitcoin-core/secp256k1.git /tmp/secp
          cd /tmp/secp && ./autogen.sh
          ./configure --enable-module-schnorrsig --enable-module-recovery --disable-benchmark --disable-tests --disable-exhaustive-tests
          make -j"$(nproc)" && sudo make install && sudo ldconfig
      - name: build with ASan+UBSan
        run: cmake -S . -B build-asan -DSOST_ENABLE_PHASE2_SBPOW=ON -DSOST_TESTNET_FORKS=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" && cmake --build build-asan -j"$(nproc)"
      - name: consensus tests under sanitizers (REQUIRED)
        run: ctest --test-dir build-asan -R "casert|reorg|transcript|chainwork|checkpoints|jackpot|node-participation|json-rpc|sbpow|convergencex|mtp-fork|profile-magic" --output-on-failure

  fuzz-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: base deps
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev cmake build-essential autoconf automake libtool pkg-config git
      - name: build libsecp256k1 with schnorrsig
        run: |
          git clone --depth 1 --branch "$SECP_REF" https://github.com/bitcoin-core/secp256k1.git /tmp/secp
          cd /tmp/secp && ./autogen.sh
          ./configure --enable-module-schnorrsig --enable-module-recovery --disable-benchmark --disable-tests --disable-exhaustive-tests
          make -j"$(nproc)" && sudo make install && sudo ldconfig
      - name: build sost-core lib
        run: cmake -S . -B build -DSOST_ENABLE_PHASE2_SBPOW=ON -DSOST_TESTNET_FORKS=OFF -DCMAKE_BUILD_TYPE=Release && cmake --build build --target sost-core -j"$(nproc)"
      - name: build fuzzers
        run: |
          clang++ -std=c++17 -O1 -g -fsanitize=fuzzer,address,undefined -I include -I . \
            tests/fuzz/fuzz_tx_block.cpp build/libsost-core.a -lcrypto -lssl -lsecp256k1 -o fuzz_txblock
          clang++ -std=c++17 -O1 -g -fsanitize=fuzzer,address,undefined -I include \
            tests/fuzz/fuzz_json_rpc.cpp src/json_rpc.cpp -o fuzz_json
      - name: fuzz smoke (REQUIRED — 90s each, any crash fails)
        run: |
          ASAN_OPTIONS=abort_on_error=1:detect_leaks=0 ./fuzz_txblock -max_total_time=90 tests/fuzz/corpus_tx_block
          ASAN_OPTIONS=abort_on_error=1:detect_leaks=0 ./fuzz_json     -max_total_time=90
