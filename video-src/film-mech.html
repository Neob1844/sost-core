<!doctype html><html><head><meta charset="utf-8">
<title>SOST Mechanisms — Atomic Swap, DTD &amp; DTD Jackpot</title>
<link rel="stylesheet" href="lib/brand.css">
<link rel="stylesheet" href="lib/film.css">
<style>
  .mark{width:230px;height:230px}
  .wordmark{font-size:88px;margin-top:48px}
  .mcard{border-radius:26px;padding:40px 36px;text-align:center;background:rgba(10,12,18,.7)}
  .mcard h3{font-family:var(--sans);font-size:46px;color:#fff;margin-top:24px}
  .mcard p{font-family:var(--mono);font-size:24px;color:#AEBAC4;margin-top:14px;line-height:1.5}
  .mn{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:700;font-size:26px;color:#fff}
  .hash{font-family:var(--mono);font-size:19px;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(10,12,18,.7);color:#9AA6B0}
  .tl{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.10)}
  .seg{display:flex;height:120px;border-radius:20px;overflow:hidden;border:2px solid rgba(255,255,255,.12)}
  .seg div{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--sans);font-weight:700;color:#fff;overflow:hidden;white-space:nowrap}
  .seg small{font-family:var(--mono);font-weight:400;font-size:20px;opacity:.9;margin-top:4px}
</style></head><body>
<div class="stage">
  <canvas id="amb" width="1920" height="1080"></canvas>
  <div class="scene" id="sc"></div>
  <div class="vign"></div>
  <div class="rail" id="rail"></div>
  <div class="corner" id="corner"><img id="cmk" src="lib/sost-logo.png" alt=""><span class="cw">SOST</span></div>
</div>
<script src="lib/ambient.js"></script>
<script src="lib/film.js"></script>
<script>
/* "SOST Mechanisms — Atomic Swap, DTD & DTD Jackpot" (2026-10). Checked on 2026-10-11 against:
   index.html (#dtd, two-draws box, research notice), news.html (#jackpot-v2-first-draw,
   #node-bind-open), getjackpotv2audit / the earnings index (17 jackpots paid = 1,700 SOST,
   #25,290 … #29,898; #30,186 no eligible winner, +100 rolled over, #30,474 pot 200),
   consensus code (lottery.h SOST_LOTTERY_V11, jackpot_v2.cpp SOST_HIST_JACKPOT).
   #40,000 80/15/5 is shown as PLANNED, exactly as the site frames it (research horizon, needs a
   future upgrade) — never as a rule in force. No BTC leg (gated off). */
var LOGO='<img class="mark" src="lib/sost-logo.png" alt="">';
var I=F.in, K=F.k;
function ico(name,c,sz){
  var s={
    swap:'<path d="M4 8h14l-4-4M20 16H6l4 4"/>', lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    check:'<path d="M4 12l5 5L20 6"/>', sigma:'<path d="M17 5H7l6 7-6 7h10"/>', trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4a3 3 0 0 0 4 4M16 6h4a3 3 0 0 1-4 4M12 13v4M8 21h8M9 17h6v4H9z"/>',
    vault:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="4"/><path d="M12 8v1M12 15v1M8 12h1M15 12h1M3 9H1M3 15H1"/>',
    pick:'<path d="M14 4c3 0 6 2 7 5-3-2-6-3-10-2M10 7 3 21"/>', node:'<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/>',
    heart:'<path d="M3 12h4l2-5 4 10 2-5h6"/>', key:'<circle cx="7" cy="15" r="4"/><path d="M10 12l9-9M15 7l3 3"/>', hash:'<path d="M9 3 7 21M17 3l-2 18M4 8h17M3 16h17"/>',
    x:'<path d="M6 6l12 12M18 6 6 18"/>'
  }[name];
  sz=sz||44;
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="'+(c||'#fff')+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+s+'</svg>';
}
/* full-bleed photo backdrop, dimmed, with a slow Ken Burns; text stays on the dark side */
function bg(file,t,dur,op,side){
  return '<div style="position:absolute;inset:0;'+I(t,0,1.4,0)+'"><img src="assets/photos/'+file+'.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:'+(op||.4)+';'+F.kb(t,dur,1.04,1.13,side||1,0)+'">'+
    '<div style="position:absolute;inset:0;background:linear-gradient('+(side<0?'270deg':'90deg')+',rgba(6,5,8,.94) 34%,rgba(6,5,8,.55) 70%,rgba(6,5,8,.35))"></div></div>';
}
function miner(col,o,lbl,sc){return '<div style="text-align:center;opacity:'+o+';transform:scale('+(sc||1)+')"><div class="mn" style="border:3px solid '+col+';background:'+col+'1f;box-shadow:0 0 22px '+col+'66">'+ico('pick',col,38)+'</div>'+(lbl?'<div class="small" style="margin-top:10px;color:'+col+'">'+lbl+'</div>':'')+'</div>';}

window.FILM={title:'SOST Mechanisms',scenes:[

/* 0 — title */
{name:'',dur:8,pal:'violet',corner:false,rail:false,particles:190,draw:function(t){
  return '<div class="wrap center"><div style="'+I(t,.2,1.1,0,.85)+'">'+LOGO+'</div>'+
    '<div class="wordmark" style="'+I(t,1.0,1)+'">SOST Mechanisms</div>'+
    '<div class="lead" style="margin-top:36px;'+I(t,2.0)+'"><span style="color:#5FE0F0">Atomic Swap</span> &middot; <span style="color:#D07BFF">DTD</span> &middot; <span style="color:#FFC96B">DTD Jackpot</span></div></div>';
}},

/* 1 — overview */
{name:'Three mechanisms',dur:9,pal:'violet',acc:'#D07BFF',draw:function(t){
  var c=[['swap','#5FE0F0','Atomic Swap','Trade without trusting<br>the other side.'],['sigma','#D07BFF','DTD','Half of every block goes<br>to an active miner.'],['trophy','#FFC96B','DTD Jackpot','A historic reserve, returned<br>to the miners who run SOST.']];
  return '<div class="wrap" style="display:flex;flex-direction:column;justify-content:center;gap:64px"><div class="stack" style="text-align:center"><div class="kick" style="'+I(t,.2)+'">How SOST works</div><div class="h2" style="'+I(t,.5)+'">Three mechanisms, <span class="acc">all on chain</span>.</div></div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:40px">'+c.map(function(x,i){return '<div class="mcard" style="border:2px solid '+x[1]+'77;box-shadow:0 0 34px '+x[1]+'22;'+I(t,1.3+i*.6,.8,50)+'">'+ico(x[0],x[1],70)+'<h3>'+x[2]+'</h3><p>'+x[3]+'</p></div>';}).join('')+'</div></div>';
}},

/* 2 — atomic swap: shared secret */
{name:'Atomic Swap',dur:13,pal:'cyan',acc:'#5FE0F0',draw:function(t){
  var s1=K(t,2.0,.8), s2=K(t,4.0,.8), s3=K(t,6.4,.8), s4=K(t,8.6,.8);
  function step(n,txt,k,col){return '<div style="display:flex;gap:20px;align-items:center;opacity:'+(0.25+0.75*k).toFixed(3)+'"><div class="mn" style="width:54px;height:54px;flex:none;font-size:22px;border:2px solid '+col+';background:'+col+(k>.5?'33':'0d')+'">'+n+'</div><div class="lead" style="font-size:24px;line-height:1.45">'+txt+'</div></div>';}
  return '<div class="wrap split"><div class="stack"><div class="kick" style="'+I(t,.2)+'">Mechanism 1</div><div class="h1" style="'+I(t,.5)+'"><span class="acc">Atomic Swap</span></div>'+
    '<div class="lead" style="'+I(t,1.2)+'">SOST for <b>ETH</b> or <b>stablecoins</b>, with a stranger, without trusting them.</div></div>'+
    '<div style="gap:24px;display:flex;flex-direction:column">'+
      step(1,'Alice picks a <b>secret</b> and publishes only its <b>hash</b>.',s1,'#5FE0F0')+
      step(2,'Both lock their coins to that hash,<br>each on its own chain, each with a timeout.',s2,'#5FE0F0')+
      step(3,'Alice claims Bob\'s coins &mdash; and in doing so<br><b>reveals the secret</b> on chain.',s3,'#5FE0F0')+
      step(4,'Bob uses the revealed secret to claim Alice\'s.',s4,'#4FE6BE')+
      '<div class="hash" style="'+I(t,2.4)+'">hash = H(<span style="color:#5FE0F0">'+(t<6.4?'&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;':F.type(t,6.4,'a91f3c07e2',10))+'</span>) &rarr; 4d7c&hellip;e19b</div></div></div>';
}},

/* 3 — HTLC guarantees */
{name:'No middleman',dur:10,pal:'cyan',acc:'#5FE0F0',draw:function(t){
  var no=['no intermediary','no escrow','no admin key','no pause switch'];
  return '<div class="wrap center" style="gap:50px"><div style="'+I(t,.2,.9,0,.8)+'">'+ico('lock','#5FE0F0',110)+'</div>'+
    '<div class="h2" style="'+I(t,.8)+'">Either <span class="acc">both</span> get their coins &mdash;<br>or <span class="acc">both</span> walk away with their own.</div>'+
    '<div style="display:flex;gap:20px;flex-wrap:wrap;justify-content:center">'+no.map(function(x,i){return '<span class="pill" style="--bc:rgba(255,61,79,.55);'+I(t,2.6+i*.4,.6)+'">'+ico('x','#FF6A78',26)+x+'</span>';}).join('')+'</div>'+
    '<div class="lead" style="'+I(t,4.6)+'">The hash time-locked contract <b>is</b> the escrow. No one can move the funds.</div></div>';
}},

/* 4 — DTD: every block */
{name:'DTD',dur:12,pal:'violet',acc:'#D07BFF',draw:function(t){
  var cyc=F.p(t,1.5,11), n=Math.floor(cyc*4), loc=(cyc*4)%1;
  var blocks=''; for(var i=0;i<5;i++){var on=i<=n, cur=i===n;
    blocks+='<div style="width:120px;height:120px;border-radius:20px;border:3px solid '+(on?'#D07BFF':'#3a3046')+';background:rgba(208,123,255,'+(on?0.14:0.03)+');display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:'+(i<=n+1?1:.35)+';box-shadow:'+(cur?'0 0 40px rgba(208,123,255,.6)':'none')+'"><div class="small" style="color:#fff">#'+(30500+i)+'</div><div style="display:flex;gap:6px;margin-top:10px"><i style="width:30px;height:10px;border-radius:5px;background:'+(on?'#FF3D4F':'#333')+'"></i><i style="width:30px;height:10px;border-radius:5px;background:'+(on?'#D07BFF':'#333')+'"></i></div></div>';}
  return '<div class="wrap" style="display:flex;flex-direction:column;justify-content:center;gap:70px"><div class="stack"><div class="kick" style="'+I(t,.2)+'">Mechanism 2 &middot; since #25,000</div><div class="h1" style="'+I(t,.5)+'"><span class="acc">DTD</span> &mdash; Deterministic<br>Token Distribution</div></div>'+
    '<div style="display:flex;gap:26px;'+I(t,1.2)+'">'+blocks+'</div>'+
    '<div style="display:flex;gap:60px;'+I(t,2.2)+'"><div class="lead"><span style="color:#FF3D4F;font-weight:700">50%</span> &rarr; the miner who found the block</div><div class="lead"><span style="color:#D07BFF;font-weight:700">50%</span> &rarr; an active miner, chosen by the DTD</div></div>'+
    '<div class="small" style="'+I(t,3.6)+'">EVERY BLOCK &middot; BY RULES, NOT BY DECREE</div></div>';
}},

/* 5 — who can win the normal DTD */
{name:'Who can win',dur:13,pal:'violet',acc:'#D07BFF',draw:function(t){
  var ms=[];
  for(var i=0;i<9;i++){
    var active=i!==2&&i!==7, cool=i===4, out=!active?K(t,3.0,.8):(cool?K(t,5.6,.8):0), win=i===6?K(t,9.0,.8):0;
    var col=win>0?'#FFC96B':(cool?'#FF8A5A':(!active?'#555':'#D07BFF'));
    ms.push(miner(col,(1-0.7*out).toFixed(3),win>0?'DTD winner':(cool&&out>0?'cooldown':(!active&&out>0?'inactive':'')),(1+0.18*win).toFixed(3)));
  }
  return bg('cpus',t,13,.3,-1)+'<div class="wrap split" style="grid-template-columns:1fr 1fr"><div class="stack"><div class="kick" style="'+I(t,.2)+'">Normal DTD &middot; every block</div><div class="h2" style="'+I(t,.5)+'">Who can win?</div>'+
    '<div class="bul" style="gap:26px">'+
      '<div style="font-size:28px;'+I(t,2.4)+'"><i></i><span>Mined in the <b>last 288 blocks</b> (~2 days)</span></div>'+
      '<div style="font-size:28px;'+I(t,5.0)+'"><i style="background:#FF8A5A;box-shadow:0 0 16px #FF8A5A"></i><span>Not a very recent producer &mdash; <b>cooldown</b>,<br>with a fallback so nobody is left out</span></div>'+
      '<div style="font-size:28px;'+I(t,7.0)+'"><i></i><span><b>Anti-dominance</b> once 11+ miners are active</span></div>'+
      '<div style="font-size:28px;'+I(t,8.6)+'"><i style="background:#FFC96B;box-shadow:0 0 16px #FFC96B"></i><span>Then a <b>uniform pick</b> among the eligible</span></div></div></div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:40px;justify-items:center;'+I(t,1.0)+'">'+ms.join('')+'</div></div>';
}},

/* 6 — deterministic seed */
{name:'Public randomness',dur:12,pal:'cyan',acc:'#5FE0F0',draw:function(t){
  var hs=['7e1c…a90f','03bd…5c21','c94e…11a7','5a20…e3d8','e81f…0b64','2c77…94ae'];
  var fl=K(t,4.2,1);
  return '<div class="wrap" style="display:flex;flex-direction:column;justify-content:center;gap:56px"><div class="stack" style="text-align:center"><div class="kick" style="'+I(t,.2)+'">Where the randomness comes from</div><div class="h2" style="'+I(t,.5)+'">Public, and <span class="acc">recomputable by anyone</span>.</div></div>'+
    '<div style="display:grid;grid-template-columns:1.1fr auto .9fr auto .8fr;gap:34px;align-items:center">'+
      '<div style="display:flex;flex-direction:column;gap:10px">'+hs.map(function(h,i){return '<div class="hash" style="'+F.fromL(t,1.2+i*.22,.5)+'">block hash '+h+'</div>';}).join('')+'<div class="small" style="'+I(t,2.8)+'">… the 16 previous blocks + the height</div></div>'+
      '<div style="font-size:60px;color:#5FE0F0;opacity:'+fl.toFixed(2)+'">&rarr;</div>'+
      '<div class="box" style="--bc:rgba(95,224,240,.6);--bg2:rgba(95,224,240,.18);padding:30px;text-align:center;'+I(t,4.4)+'">'+ico('hash','#5FE0F0',60)+'<div class="lead" style="font-size:24px;margin-top:14px">hashed under a<br><b>domain tag</b></div><div class="small" style="margin-top:12px;color:#5FE0F0">SOST_LOTTERY_V11</div></div>'+
      '<div style="font-size:60px;color:#5FE0F0;opacity:'+K(t,6.4,1).toFixed(2)+'">&rarr;</div>'+
      '<div style="text-align:center;'+I(t,6.8,.9,30,.85)+'">'+miner('#FFC96B',1,'the winner',1.2)+'</div></div>'+
    '<div class="lead" style="text-align:center;font-size:26px;'+I(t,8.6)+'">No oracle, no committee: every node derives the same winner from the chain.</div></div>';
}},

/* 7 — DTD Jackpot: the reserve */
{name:'DTD Jackpot',dur:13,pal:'gold',acc:'#FFC96B',draw:function(t){
  var fill=F.eio(F.p(t,3.5,10.5)), pot=Math.round((100+400*fill)/100)*100;
  return bg('gold',t,13,.42,-1)+'<div class="wrap split"><div class="stack"><div class="kick" style="'+I(t,.2)+'">Mechanism 3</div><div class="h1" style="'+I(t,.5)+'"><span class="acc">DTD Jackpot</span></div>'+
    '<div class="lead" style="'+I(t,1.3)+'">The historical <b>Gold Vault + PoPC</b> balance is returned to the <b>active miners</b> &mdash; never to a founder.</div>'+
    '<div class="bul" style="gap:22px">'+
      '<div style="font-size:28px;'+I(t,3.2)+'"><i></i>A draw every <b>288 blocks</b> (~48 h)</div>'+
      '<div style="font-size:28px;'+I(t,4.6)+'"><i></i><b>100 SOST</b> base pot</div>'+
      '<div style="font-size:28px;'+I(t,6.0)+'"><i></i>No eligible winner &rarr; it <b>rolls over</b></div>'+
      '<div style="font-size:28px;'+I(t,7.4)+'"><i></i>Capped at <b>500 SOST</b></div></div></div>'+
    '<div style="text-align:center;'+I(t,1.0,.9,30,.9)+'"><div style="position:relative;width:380px;height:520px;margin:0 auto;border-radius:30px;border:3px solid rgba(255,201,107,.7);background:rgba(20,16,8,.75);overflow:hidden;box-shadow:0 0 60px rgba(255,201,107,.25)">'+
      '<div style="position:absolute;left:0;right:0;bottom:0;height:'+(18+76*fill).toFixed(1)+'%;background:linear-gradient(180deg,#FFD98A,#E0A23A 60%,#9C6A14)"></div>'+
      '<div style="position:absolute;left:0;right:0;top:6%;border-top:2px dashed rgba(255,255,255,.55)"></div><div class="small" style="position:absolute;right:16px;top:8%;color:#fff">cap 500</div>'+
      '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--sans);font-weight:700;font-size:74px;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.6)">'+ico('trophy','#fff',80)+'<span style="margin-top:14px">'+pot+'</span><span style="font-size:26px;font-family:var(--mono);font-weight:400">SOST pot</span></div></div>'+
      '<div class="small" style="margin-top:18px">pot grows with each rollover &middot; cap 500</div></div></div>';
}},

/* 8 — history: 17 jackpots paid */
{name:'On-chain history',dur:12,pal:'gold',acc:'#FFC96B',draw:function(t){
  var hs=[]; for(var h=25290;h<=29898;h+=288) hs.push(h);
  var k=F.p(t,2.0,8.0)*hs.length, W=1560;
  var dots=hs.map(function(h,i){var on=k>i, x=(i/(hs.length-1))*W;
    return '<div style="position:absolute;left:'+x.toFixed(0)+'px;top:-17px;width:40px;height:40px;margin-left:-20px;border-radius:50%;border:3px solid '+(on?'#FFC96B':'#4a4030')+';background:'+(on?'rgba(255,201,107,.35)':'#14110a')+';box-shadow:'+(on?'0 0 22px #FFC96B':'none')+'"></div>'+
      ((i===0||i===hs.length-1)?'<div class="small" style="position:absolute;left:'+x.toFixed(0)+'px;top:40px;transform:translateX(-50%);color:#FFC96B">#'+F.num(h)+'</div>':'');}).join('');
  var paid=Math.min(17,Math.floor(k));
  return '<div class="wrap" style="display:flex;flex-direction:column;justify-content:center;gap:80px"><div class="stack"><div class="kick" style="'+I(t,.2)+'">Verified on chain</div>'+
    '<div class="h1" style="'+I(t,.5)+'"><span class="acc">'+paid+'</span> jackpots paid &middot; <span class="acc">'+F.num(paid*100)+'</span> SOST</div></div>'+
    '<div class="tl" style="width:'+W+'px;'+I(t,1.2)+'"><div style="height:100%;width:'+(100*F.cl(k/hs.length,0,1)).toFixed(2)+'%;background:#FFC96B;border-radius:3px"></div>'+dots+'</div>'+
    '<div class="lead" style="'+I(t,8.6)+'">From the first jackpot at <b>#25,290</b> to <b>#29,898</b>: one every 288 blocks, each paid to a real miner, each visible in the Explorer.</div></div>';
}},

/* 9 — Jackpot V2 eligibility */
{name:'Jackpot V2',dur:13,pal:'gold',acc:'#FFC96B',draw:function(t){
  var req=[['key','NODE_BIND','your mining key and your <b>node key</b>, bound together on chain'],['heart','Heartbeats','your node proves it is alive, one per 288-block epoch'],['pick','SbPoW blocks','at least <b>3 blocks</b> mined in the last 2,016']];
  return bg('rack',t,13,.4,-1)+'<div class="wrap split" style="grid-template-columns:.9fr 1.1fr"><div class="stack"><div class="kick" style="'+I(t,.2)+'">Since <b>#30,000</b></div><div class="h1" style="'+I(t,.5)+'">Jackpot <span class="acc">V2</span></div>'+
    '<div class="lead" style="'+I(t,1.3)+'">Rewards miners who also <b>run a node</b>.</div>'+
    '<div class="lead" style="font-size:27px;'+I(t,8.4)+'">The winner is picked <b>weighted by PoW blocks</b>.<br>No cooldown, no anti-dominance.</div></div>'+
    '<div style="display:flex;flex-direction:column;gap:26px">'+req.map(function(r,i){var a=2.4+i*1.6;
      return '<div class="box" style="--bc:rgba(255,201,107,.55);--bg2:rgba(255,201,107,.12);display:flex;gap:30px;align-items:center;padding:28px 34px;'+F.fromR(t,a,.8)+'">'+ico(r[0],'#FFC96B',64)+'<div><div class="h2" style="font-size:40px">'+r[1]+'</div><div class="lead" style="font-size:24px;margin-top:6px">'+r[2]+'</div></div><div style="margin-left:auto;opacity:'+K(t,a+.8,.5).toFixed(2)+'">'+ico('check','#4FE6BE',48)+'</div></div>';}).join('')+'</div></div>';
}},

/* 10 — two draws, one block: #30,186 */
{name:'Two draws',dur:13,pal:'violet',acc:'#D07BFF',draw:function(t){
  var r=K(t,6.6,.8), nx=K(t,8.6,.8);
  return '<div class="wrap" style="display:flex;flex-direction:column;justify-content:center;gap:48px"><div class="stack"><div class="kick" style="'+I(t,.2)+'">Two independent draws &middot; one block</div><div class="h2" style="'+I(t,.5)+'">Block <span class="acc">#30,186</span> &mdash; the first V2 draw</div></div>'+
