<!doctype html><html><head><meta charset="utf-8">
<title>SOST Mechanisms — title card</title>
<link rel="stylesheet" href="lib/brand.css">
<style>
  .stage{gap:0}
  .mark{width:250px;height:250px}
  /* Separation is explicit, not incidental: the wordmark never enters the
     mark's optical box, and the glow falls off well before it. */
  .wordmark{font-size:86px;margin-top:62px}
  .subtitle{font-size:34px;margin-top:52px}
</style></head><body>
<div class="stage">
  <img class="mark pulse" id="mark" src="lib/sost-logo.png" alt="">
  <div class="wordmark">SOST</div>
  <div class="subtitle"><span class="r">Atomic Swap</span> &amp; <span class="v">DTD</span> &mdash; how the two core mechanisms work</div>
</div>
<script>
// Deterministic pulse: intensity is a pure function of t, so frame N always
// renders identically. 2.4 s cycle, matching the site's logo glow.
(function(){
  var t=parseFloat(new URLSearchParams(location.search).get('t')||'0');
  var k=0.5-0.5*Math.cos(2*Math.PI*t/2.4);      // 0..1
  var e=0.62+0.38*k;                             // never fully drops
  document.getElementById('mark').style.filter=
    'drop-shadow(0 0 '+(12+8*k).toFixed(1)+'px rgba(255,16,36,'+(0.55*e).toFixed(3)+')) '+
    'drop-shadow(0 0 '+(34+18*k).toFixed(1)+'px rgba(255,16,36,'+(0.40*e).toFixed(3)+')) '+
    'drop-shadow(0 0 '+(78+34*k).toFixed(1)+'px rgba(255,16,36,'+(0.24*e).toFixed(3)+'))';
  document.documentElement.setAttribute('data-ready','1');
})();
</script></body></html>
