# sostcore.com server block (443) — Explorer routes and conventional icon paths.
# Published 16-Nov-2026. Placed next to the other Explorer 301 rules, before "location /".
# Without these rules the site-wide fallback (try_files ... /index.html) answered these paths with the Home page.

# Explorer: one canonical URL, server-side 301 (query string kept; the browser keeps #fragment)
location = /sost-explorer { return 301 /sost-explorer.html$is_args$args; }
location = /sost-explorer/ { return 301 /sost-explorer.html$is_args$args; }
location = /explorer { return 301 /sost-explorer.html$is_args$args; }
location = /explorer/ { return 301 /sost-explorer.html$is_args$args; }
location = /explorer.html { return 301 /sost-explorer.html$is_args$args; }

# Conventional icon paths requested by browsers and crawlers: serve the official SOST icons
location = /favicon-32x32.png { try_files /brand/sost/favicon/favicon-32x32.png =404; }
location = /favicon-16x16.png { try_files /brand/sost/favicon/favicon-16x16.png =404; }
location = /favicon.png { try_files /favicon-96x96.png =404; }
location = /apple-touch-icon-precomposed.png { try_files /apple-touch-icon.png =404; }
