# SOST node/miner logs — install as /etc/logrotate.d/sost
#
# copytruncate because the node holds the file open and does not reopen it on a signal:
# rotating by rename would leave it writing to an unlinked inode and the new file empty.
/var/log/sost-node.log /var/log/sost-miner.log {
    daily
    rotate 7
    maxsize 100M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
