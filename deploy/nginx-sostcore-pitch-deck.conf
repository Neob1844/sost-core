# sostcore.com server block (443) — institutional pitch deck. Published 16-Nov-2026.
# /sost-pitch-deck is an HTML viewer page (versioned Sigma favicon, embedded PDF, open/download links);
# it is served through the regular *.html location so it gets the site security headers.
# A PDF opened directly has no HTML head, so the browser uses the unversioned /favicon.ico and may keep a
# stale cached copy; the viewer page avoids that. The PDF itself stays at /sost-pitch-deck.pdf.
location = /sost-pitch-deck { rewrite ^ /sost-pitch-deck.html last; }
location = /sost-pitch-deck/ { return 301 /sost-pitch-deck; }
# Let browsers refresh a stale cached favicon (no Cache-Control was sent before).
location = /favicon.ico { add_header Cache-Control "public, max-age=86400, must-revalidate" always; add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; add_header X-Content-Type-Options "nosniff" always; try_files $uri =404; }
