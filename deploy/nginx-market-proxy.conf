# SOST market-history gateway — add inside the server {} block of the site config.
# The gateway is closed: it accepts only an (asset, vs, range) triple from a fixed
# allowlist and builds the upstream URL itself. It is not a general HTTP proxy.
location /api/market-history {
    proxy_pass http://127.0.0.1:18310/market-history$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    if ($request_method = OPTIONS) { return 204; }
}
