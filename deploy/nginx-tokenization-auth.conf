# =============================================================================
# SOST V30000 — server-side ADMIN auth for the Tokenization / DEX interfaces.
# Include this INSIDE the sostcore.com HTTPS server { } block, then set the
# credentials with the procedure in deploy/TOKENIZATION_AUTH_SETUP.md.
# Deny-by-default: with no htpasswd file present nginx returns 403, so the
# interfaces are locked until the operator explicitly creates a credential.
# NOTE: this is the WEB layer. The protocol-level admin gate (consensus S14,
# docs/v30000/ADMIN_CONSENSUS_GATE.md) is the independent second barrier that
# stops hand-crafted CLI/RPC operations regardless of the web layer.
# =============================================================================

# Brute-force protection: cap auth attempts per client IP (place the zone in the
# http{} context — shown here for reference; move if your layout requires it).
# limit_req_zone $binary_remote_addr zone=sost_tokauth:10m rate=10r/m;

location ~ ^/(atomic-swap-console|sost-tokenization-dashboard|sost-dex-dashboard)\.html$ {
    auth_basic           "SOST Tokenization/DEX — authorised administrators only";
    auth_basic_user_file  /etc/nginx/sost-tokenization.htpasswd;   # bcrypt, set by operator, never in git

    limit_req             zone=sost_tokauth burst=5 nodelay;        # throttle brute force
    limit_req_status      429;

    # sensitive admin UI: never cache
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma        "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    try_files $uri =404;
}
