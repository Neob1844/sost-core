# SOST website contact endpoint — nginx snippet.
# Paste INSIDE the `server { server_name sostcore.com www.sostcore.com; ... }` block of
# /etc/nginx/sites-enabled/sost, next to the other `location` blocks (e.g. after
# `location /api/market-history`). Also add, once, at http level (top of the same file,
# next to the existing limit_req_zone lines):
#
#   limit_req_zone $binary_remote_addr zone=sost_contact:10m rate=6r/m;
#
location = /api/contact {
    # A location with its own add_header drops the server-level ones: repeat them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
    # Same-origin form only: no CORS headers on purpose.
    limit_except POST { deny all; }
    limit_req zone=sost_contact burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    proxy_pass http://127.0.0.1:18330;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 30s;
    proxy_intercept_errors off;
}
