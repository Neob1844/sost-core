# SOST private dashboards — custom login + signed session cookie (no native Basic Auth popup).
location = /_dashauth/verify { internal; proxy_pass http://127.0.0.1:18322; proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header X-Real-IP $remote_addr; }
location = /_dashauth/login  { limit_req zone=sost_tokauth burst=5 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:18322; proxy_set_header X-Real-IP $remote_addr; }
location = /_dashauth/logout { proxy_pass http://127.0.0.1:18322; }
location @sost_login_tok { return 302 /tokenization-login.html; }
location @sost_login_dex { return 302 /dex-login.html; }
location = /sost-tokenization-dashboard.html {
    auth_request /_dashauth/verify; error_page 401 403 = @sost_login_tok;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always; add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
}
location ~ ^/(sost-dex-dashboard|atomic-swap-console)\.html$ {
    auth_request /_dashauth/verify; error_page 401 403 = @sost_login_dex;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always; add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
}
